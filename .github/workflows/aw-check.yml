name: VOGA Aerodrome Warning Check

on:
  schedule:
    - cron: '2-57/5 * * * *'  # every 5 min, offset from :00/:05 to dodge GitHub-wide congestion
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

concurrency:
  group: voga-aerodrome-warning-check
  cancel-in-progress: false   # if a run is already going, new ones wait instead of racing it

permissions:
  contents: write            # needed so this workflow can push the JSON file

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch and parse warning
        run: python scripts/fetch_aw_json.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update VOGA aerodrome warning JSON"
          file_pattern: data/voga_warning.json
